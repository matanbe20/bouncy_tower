<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <title>Bouncy Tower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; height: 100%; background: #05070f; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    canvas { display: block; touch-action: none; outline: none; box-shadow: 0 0 60px rgba(60,140,255,0.15); }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="480" tabindex="0"></canvas>
  <script src="js/audio.js"></script>
  <script src="js/gfx.js"></script>
  <script src="js/game.js"></script>

</html>
